services:
  db:
    image: postgres:16-alpine
    container_name: skill-matrix-db
    pull_policy: if_not_present
    restart: always
    environment:
      POSTGRES_DB: skillmatrix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - skillmatrix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillmatrix"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    image: skillmatrix-app:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: skill-matrix-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/skillmatrix?schema=public
      - SESSION_SECRET=${SESSION_SECRET:-skillmatrix-prod-session-secret-key-32chars!!}
      - UPLOAD_DIR=/app/uploads
      - COOKIE_SECURE=false
    volumes:
      - skillmatrix_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  skillmatrix_pgdata:
    driver: local
  skillmatrix_uploads:
    driver: local
