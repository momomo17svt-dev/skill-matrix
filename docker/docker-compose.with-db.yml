services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: skillmatrix_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - skillmatrix_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    image: skillmatrix-app:latest
    container_name: skillmatrix_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlserver://db:1433;database=skillmatrix;user=sa;password=Password123!;trustServerCertificate=true;
      - SESSION_SECRET=${SESSION_SECRET:-skillmatrix-prod-session-secret-key-32chars!!}
      - UPLOAD_DIR=/app/uploads
      - COOKIE_SECURE=false
    volumes:
      - skillmatrix_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  skillmatrix_db_data:
    driver: local
  skillmatrix_uploads:
    driver: local
